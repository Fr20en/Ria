name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Ria-v${VERSION}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ria-APK
          path: dist/*.apk

      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ (alpha|beta|rc|dev|preview|snapshot) ]]; then
            echo "Tag $TAG is not a stable release, skip publishing."
            exit 0
          fi
          gh release create "$TAG" dist/*.apk --title "Ria $TAG" --generate-notes
